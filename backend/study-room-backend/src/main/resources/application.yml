spring:
  application:
    name: study-room-backend

  # ${TEN_BIEN:gia_tri_mac_dinh} -> đọc biến môi trường, không có thì dùng mặc định (chỉ hợp cho local).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/focoya}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Flyway tạo/sửa schema. Hibernate CHỈ kiểm tra entity khớp với bảng, sai là app không khởi động.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
