spring:
  application:
    name: study-room-backend

  # ${TEN_BIEN:gia_tri_mac_dinh} -> đọc biến môi trường, không có thì dùng mặc định (chỉ hợp cho local).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/focoya}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # update: Hibernate tự tạo bảng/cột còn thiếu dựa trên các class trong entity/.
      # Lưu ý: update KHÔNG xóa và KHÔNG đổi tên cột. Đổi tên field -> sinh cột mới, cột cũ vẫn nằm lại.
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

# JWT. Secret phải dài >= 32 ký tự (HMAC-SHA256 cần khóa 256 bit).
# Mặc định chỉ dùng cho local. Lên server thật phải đặt biến môi trường JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:focoya-local-dev-secret-key-do-not-use-in-production}
  access-token-minutes: 30
  refresh-token-days: 7

# CORS: địa chỉ trang FE được phép gọi API. Lúc deploy đặt biến môi trường CORS_ALLOWED_ORIGIN.
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5174}
