openapi: 3.0.3
info:
  title: Virtual Study Room API
  description: >-
    API Contract v1 cho nền tảng phòng học ảo và cộng đồng (REST controllers phục vụ dưới prefix `/api`).
    Giới hạn đã biết: `PresenceRegistry` lưu trạng thái realtime trong RAM trên 1 JVM (multi-instance cần shared store),
    và endpoint join theo `inviteCode` không đặt rate limiter trong RAM ứng dụng — production cần cấu hình rate limit/WAF ở gateway/reverse proxy để chống brute-force mã mời 6 ký tự.
    Các response phòng riêng / invite (`/rooms/me`, `POST /rooms`, `/rooms/join/{inviteCode}`, `GET /rooms/{roomId}` với phòng `PRIVATE`) trả header `Cache-Control: no-store`.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, đăng xuất
  - name: User
    description: Thông tin và profile người dùng
  - name: Room
    description: Phòng học
  - name: Study
    description: Phiên học
  - name: Gamification
    description: XP, streak, daily goal và badge

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      tags: [User]
      summary: Lấy thông tin user hiện tại
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [User]
      summary: Cập nhật profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Profile đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}:
    get:
      tags: [User]
      summary: Xem profile user
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Profile user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms:
    get:
      tags: [Room]
      summary: Danh sách phòng công khai
      description: Trả danh sách phòng `PUBLIC` đang mở, lọc theo `theme` và từ khóa `q`. Không trả `inviteCode`.
      operationId: getRooms
      parameters:
        - name: theme
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Danh sách phòng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

    post:
      tags: [Room]
      summary: Tạo phòng riêng
      description: >-
        Tạo phòng `PRIVATE` (tối đa 2 phòng riêng đang hoạt động mỗi user, đồng bộ bằng khóa dòng user ở DB).
        Server tự sinh `inviteCode` 6 ký tự `[A-Z0-9]{6}` và retry có giới hạn nếu trùng khóa duy nhất.
      operationId: createRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Phòng riêng đã được tạo (kèm `inviteCode` cho chủ phòng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Không thể tạo mã mời duy nhất sau số lần thử cho phép
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/me:
    get:
      tags: [Room]
      summary: Danh sách phòng riêng của tôi
      description: >-
        Trả các phòng `PRIVATE` đang hoạt động thuộc sở hữu của user hiện tại theo thứ tự xác định
        (`createdAt ASC, name ASC, id ASC`), kèm `inviteCode`. Route được bảo vệ trước `/rooms/{roomId}`.
      operationId: getMyRooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách phòng riêng của user hiện tại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms/join/{inviteCode}:
    get:
      tags: [Room]
      summary: Xem/vào phòng theo mã mời
      description: >-
        Chuẩn hóa `trim` + chữ hoa và kiểm tra đúng 6 ký tự `[A-Z0-9]{6}` (`400` nếu sai định dạng).
        Nếu phòng đã đủ chỗ (`online >= maxSlots`), người dùng đã có mặt trong `PresenceRegistry` (single-JVM) vẫn được phép qua;
        người ngoài nhận `400`. `inviteCode` chỉ hiển thị cho chủ phòng, `null` với khách.
        Lưu ý: endpoint không có in-memory rate limiter; production phải giới hạn tốc độ ở gateway/WAF để chống brute-force.
      operationId: joinRoomByInviteCode
      security:
        - bearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{6}$"
      responses:
        "200":
          description: Thông tin phòng hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}:
    get:
      tags: [Room]
      summary: Chi tiết phòng
      description: Phòng `PUBLIC` cho phép khách xem (`inviteCode` là `null`). Phòng `PRIVATE` chỉ chủ phòng xem được theo UUID (`403` với người khác).
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Chi tiết phòng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Room]
      summary: Cập nhật phòng
      operationId: updateRoom
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: Phòng đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/join:
    post:
      tags: [Room]
      summary: Tham gia phòng
      operationId: joinRoom
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: Tham gia phòng thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomJoinResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Phòng đầy hoặc không thể tham gia

  /rooms/{roomId}/leave:
    post:
      tags: [Room]
      summary: Rời phòng
      operationId: leaveRoom
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Rời phòng thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomLeaveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/close:
    post:
      tags: [Room]
      summary: Đóng phòng
      operationId: closeRoom
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Đóng phòng thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCloseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /study-sessions/start:
    post:
      tags: [Study]
      summary: Bắt đầu phiên học
      description: >-
        startedAt là giờ server. Với phòng `PRIVATE`, user phải là chủ phòng hoặc đang có mặt trong `PresenceRegistry`
        (kiểm tra trên 1 JVM trước khi chốt bất kỳ phiên `IN_PROGRESS` nào trước đó; trả `403` nếu không đủ quyền).
        Nếu hợp lệ và user còn phiên chưa kết thúc, phiên cũ được chốt trước (theo luật của /study-sessions/finish) rồi mới tạo phiên mới.
      operationId: startStudySession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStudySessionRequest"
      responses:
        "201":
          description: Phiên học đã được bắt đầu (status IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /study-sessions/finish:
    post:
      tags: [Study]
      summary: Kết thúc phiên học đang chạy
      description: >-
        Không có body. Server tự tìm phiên IN_PROGRESS của user trong JWT và tự tính thời lượng
        theo giờ server (tối đa 60 phút). Đủ 5 phút: COMPLETED, xpEarned = số phút (1 phút = 1 XP).
        Chưa đủ 5 phút: CANCELLED, xpEarned = 0.
      operationId: finishStudySession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Phiên học đã được chốt (status COMPLETED hoặc CANCELLED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /study-sessions:
    get:
      tags: [Study]
      summary: Lịch sử học
      operationId: getStudySessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lịch sử phiên học của user
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudySessionHistoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /study-sessions/{sessionId}:
    get:
      tags: [Study]
      summary: Chi tiết phiên học
      operationId: getStudySession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Chi tiết phiên học
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /gamification/me:
    get:
      tags: [Gamification]
      summary: Lấy XP, streak và daily goal
      operationId: getMyGamification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin gamification của user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /gamification/me/goal:
    patch:
      tags: [Gamification]
      summary: Cập nhật daily goal
      operationId: updateDailyGoal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyGoalRequest"
      responses:
        "200":
          description: Daily goal đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyGoalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /badges:
    get:
      tags: [Gamification]
      summary: Danh sách badge
      operationId: getBadges
      responses:
        "200":
          description: Danh sách tất cả badge
          content:
            application/json:
              schema:
                type: object
                required: [badges]
                properties:
                  badges:
                    type: array
                    items:
                      $ref: "#/components/schemas/Badge"

  /users/me/badges:
    get:
      tags: [Gamification]
      summary: Badge của user
      operationId: getMyBadges
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Các badge user đã đạt
          content:
            application/json:
              schema:
                type: object
                required: [badges]
                properties:
                  badges:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserBadge"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarKey:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]

    PublicUser:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarKey:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        avatarKey:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true

    Room:
      type: object
      required:
        - id
        - name
        - theme
        - online
        - maxSlots
        - visibility
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        theme:
          type: string
        online:
          type: integer
          description: Số người đang online trong phòng (đọc từ PresenceRegistry trên 1 JVM, không lưu DB).
        maxSlots:
          type: integer
        image:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        inviteCode:
          type: string
          nullable: true
          description: Chỉ trả về cho chủ phòng, null với người khác hoặc phòng PUBLIC.

    CreateRoomRequest:
      type: object
      required:
        - name
        - theme
        - maxSlots
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        theme:
          type: string
          enum: [Study, Café, Nature, Gaming, Chill]
        image:
          type: string
          maxLength: 50
          pattern: "^/room-assets/(?:rainy\\.jpg|midnight\\.png|autumn\\.png|sunset\\.jpg|bg\\.png)$"
          nullable: true
        maxSlots:
          type: integer
          minimum: 10
          maximum: 30

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        themeKey:
          type: string
        sceneKey:
          type: string
          nullable: true
        ambientTrackKey:
          type: string
          nullable: true
        maxSlots:
          type: integer

    JoinRoomRequest:
      type: object
      properties:
        inviteCode:
          type: string
          nullable: true

    RoomJoinResponse:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
          format: uuid

    RoomLeaveResponse:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
          format: uuid

    RoomCloseResponse:
      type: object
      required: [roomId, isActive]
      properties:
        roomId:
          type: string
          format: uuid
        isActive:
          type: boolean

    StartStudySessionRequest:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
          format: uuid

    StudySession:
      type: object
      required:
        - id
        - userId
        - roomId
        - status
        - startedAt
        - xpEarned
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        xpEarned:
          type: integer

    StudySessionHistoryItem:
      type: object
      required:
        - id
        - roomId
        - status
        - startedAt
        - xpEarned
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        xpEarned:
          type: integer

    GamificationProfile:
      type: object
      required:
        - totalXp
        - level
        - currentStreak
        - longestStreak
        - dailyGoalMinutes
      properties:
        totalXp:
          type: integer
        level:
          type: integer
          description: Level được backend tính từ totalXp.
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        lastStudyDate:
          type: string
          format: date
          nullable: true
        dailyGoalMinutes:
          type: integer

    UpdateDailyGoalRequest:
      type: object
      required: [dailyGoalMinutes]
      properties:
        dailyGoalMinutes:
          type: integer

    DailyGoalResponse:
      type: object
      required: [dailyGoalMinutes]
      properties:
        dailyGoalMinutes:
          type: integer

    Badge:
      type: object
      required: [id, code, name, description, iconKey]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true

    UserBadge:
      type: object
      required: [id, code, name, description, iconKey, unlockedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true
        unlockedAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Chưa đăng nhập hoặc JWT không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
